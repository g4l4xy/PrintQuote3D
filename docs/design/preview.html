<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PQ Design prototypes</title><style>
:root{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--raised:#e8edf4;--text:#182230;--muted:#536175;--accent:#205bcd;--line:#b8c3d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}body.dark{color-scheme:dark;--bg:#151a21;--panel:#1e2631;--raised:#293545;--text:#f2f5fa;--muted:#afbed0;--accent:#8bb5ff;--line:#45556b}button,input,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 12px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent)}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{padding:24px 16px;background:var(--raised)}nav{display:grid;gap:8px;margin-top:32px}nav button{text-align:left}nav button.active{color:var(--accent);border-left:3px solid var(--accent)}main{padding:32px}h1{font-size:30px;margin:0 0 8px}h2{font-size:20px}p,small{color:var(--muted);line-height:1.5}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--raised);margin:24px 0}.tools input{flex:1;min-width:160px}.primary{background:var(--accent);color:var(--panel)}.dark .primary{color:#102a53}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.panel,.metric{padding:24px;background:var(--panel);border-radius:12px}.value{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;display:block;margin-top:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}table{border-collapse:collapse;width:100%}td,th{padding:16px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:13px}td:last-child{text-align:right;font-variant-numeric:tabular-nums}label{display:grid;gap:8px;margin-bottom:16px}.scroll{overflow:auto}.large{font-size:21px}.contrast{--line:var(--text);--muted:var(--text)}@media(max-width:840px){.app{grid-template-columns:150px minmax(0,1fr)}main{padding:20px}.workspace{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:600px){.app{display:block}aside{padding:12px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{padding:16px}.metrics{grid-template-columns:1fr}}
</style><div class="app"><aside><strong>PrintQuote <span style="color:var(--accent)">3D</span></strong><p>Precision in every estimate.</p><nav id="nav"></nav><p><small>PQ DESIGN · PROTOTYPE<br>Illustrative values only.</small></p></aside><main><div class="tools"><button id="theme">Light / Dark</button><button id="type">Large text</button><button id="contrast">High contrast</button></div><div id="screen"></div></main></div><script>
const names=['Dashboard','Quote Builder','Filament Library','Printer Library','Printer Detail','Filament Detail','Settings'];const field=(a,b)=>`<label>${a}<input value="${b}"></label>`,row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`,metric=(a,b)=>`<div class="metric"><small>${a}</small><span class="value">${b}</span></div>`;function show(n){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===n));let s=`<h1>${n==='Dashboard'?'Your workshop, in focus.':n}</h1><p>Clear costs. Confident decisions. Your work stays local.</p><div class="tools"><input placeholder="Search ${n.toLowerCase()}"><button>Actions</button><button class="primary">${n.includes('Detail')?'Use in quote':'New quote'}</button></div>`;if(n==='Dashboard')s+=`<div class="metrics">${metric('Saved quotes','12')}${metric('Printer profiles','1,007')}${metric('Catalog spool options','22,355')}</div><div class="workspace"><section class="panel"><h2>Recent quotes</h2><table>${row('Fixture brackets','$55.52')}${row('Enclosure prototype','$124.90')}${row('Cable organizers','$32.40')}</table></section><section class="panel"><h2>Material alerts</h2><p>2 saved spools below 100 g</p><p>Live printer monitoring is not connected.</p></section></div>`;else if(n==='Quote Builder')s+=`<div class="workspace"><section class="panel"><h2>Manufacturing</h2>${field('Project','Fixture brackets')}${field('Printer','Workshop printer')}${field('Material','PLA · Black')}${field('Model (g)','200')}<details><summary>Advanced manufacturing costs</summary><p>Electricity, labor, maintenance and drying.</p></details></section><section class="panel"><small>CUSTOMER PRICE</small><span class="value" style="color:var(--accent)">$55.52</span><table>${row('Production cost','$33.31')}${row('Margin','40%')}${row('Tax','$0.00')}</table></section></div>`;else if(n.includes('Library'))s+=`<div class="tools"><button>All manufacturers</button><button>Favorites</button><button>Recent</button><button>Table</button><button>Cards</button><button>Columns</button></div><section class="panel scroll"><h2>${n.includes('Filament')?'22,355 spool options':'1,007 configurations'}</h2><table><tr><th>Name</th><th>Specification</th></tr>${n.includes('Filament')?row('Polymaker PLA · Black','1,000 g')+row('Overture PETG · Clear','1,000 g')+row('Bambu ASA · Gray','1,000 g'):row('Workshop printer','256 × 256 × 256 mm')+row('Large format profile','300 × 300 × 300 mm')+row('Multi-tool configuration','5 toolheads')}</table><p>Sample rows for design review; production uses bounded queries.</p></section>`;else if(n.includes('Detail'))s+=`<div class="workspace"><section class="panel"><h2>Overview</h2><table>${row('Source','Imported reference')}${row('Configuration','Review before use')}</table><h2>Technical specifications</h2><details open><summary>Capabilities</summary><p>Original source values remain available alongside your overrides.</p></details><details><summary>Sources and provenance</summary><p>Version and retrieval details.</p></details></section><section class="panel"><h2>User overrides</h2>${field('Operating value','')}<p>Blank uses source data. Unknown remains unknown.</p><h2>Compatibility</h2><p>Unknown / not verified</p></section></div>`;else s+=`<div class="workspace"><section class="panel"><h2>Appearance</h2><p>System · Light · Dark</p><h2>Business defaults</h2>${field('Business name','Print workshop')}${field('Currency','USD')}</section><section class="panel"><h2>Local data</h2><p>Workspace schema 2</p><button>Validate database</button><p><button>Export support data</button></p></section></div>`;document.querySelector('#screen').innerHTML=s}names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(n);document.querySelector('#nav').appendChild(b)});theme.onclick=()=>document.body.classList.toggle('dark');type.onclick=()=>document.body.classList.toggle('large');contrast.onclick=()=>document.body.classList.toggle('contrast');show('Dashboard');</script></html>
